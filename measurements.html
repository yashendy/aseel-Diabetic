<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>سجل القياسات</title>
  <link rel="stylesheet" href="css/measurements.css?v=5" />
  <link rel="icon" href="favicon.png" />
</head>
<body>
  <div class="container">
    <header class="page-head no-print">
      <div class="right">
        <strong id="childName">جاري التحميل...</strong>
        <span id="childMeta" class="muted"></span>
      </div>
      <div class="left">
        <button id="backToChild" class="btn btn-ghost">⬅ لوحة الطفل</button>
      </div>
    </header>

    <div id="therapyChips" class="chips-bar mb-15"></div>

    <section class="input-card">
      <h3 class="card-title">🩸 تسجيل قراءة جديدة</h3>
      
      <div class="input-grid">
        <div class="field">
          <label>التاريخ</label>
          <input type="date" id="dayPicker" />
        </div>
        <div class="field">
          <label>الوقت</label>
          <input type="time" id="timePicker" />
        </div>
        <div class="field">
          <label>الفترة (Slot)</label>
          <select id="slotKey">
            <option value="FASTING">صائم / على الريق</option>
            <option value="PRE_BREAKFAST">قبل الفطار</option>
            <option value="POST_BREAKFAST">بعد الفطار</option>
            <option value="PRE_LUNCH">قبل الغدا</option>
            <option value="POST_LUNCH">بعد الغدا</option>
            <option value="PRE_DINNER">قبل العشا</option>
            <option value="POST_DINNER">بعد العشا</option>
            <option value="SNACK">سناك</option>
            <option value="BEDTIME">قبل النوم</option>
            <option value="EXERCISE">رياضة / مجهود</option>
            <option value="OTHER">وقت آخر</option>
          </select>
        </div>
        
        <!-- حقل السكر والوحدة الذكية المتغيرة -->
        <div class="field bg-input-group">
          <label>مستوى السكر</label>
          <div class="input-with-suffix">
            <input type="number" id="reading" step="0.1" placeholder="مثال: 120" />
            <select id="unitSel" class="suffix-select">
              <option value="mg/dL">mg/dL</option>
              <option value="mmol/L">mmol/L</option>
            </select>
          </div>
        </div>
      </div>

      <div id="actionsPanel" class="action-panel hidden">
        <div id="smartAlert" class="smart-alert">
          <div class="alert-icon" id="alertIcon">💡</div>
          <div class="alert-content">
            <h4 id="alertTitle">الحالة</h4>
            <p id="alertMsg">...</p>
          </div>
        </div>

        <div id="corrRow" class="action-panel-row hidden">
          <label class="field">
            <span>💉 جرعة التصحيح المأخوذة (U)</span>
            <input id="corrDoseInput" type="number" step="0.5" min="0" placeholder="مثال: 1.5">
          </label>
        </div>

        <div id="hypoRow" class="action-panel-row hidden">
          <label class="field">
            <span>🧃 عالجنا الهبوط بإيه؟</span>
            <input id="hypoTreatment" type="text" placeholder="مثال: عصير، جلوكوز، تمر...">
          </label>
          <div class="chips-bar" style="margin-top: 8px;">
            <button class="v-chip chip-btn" data-val="جلوكوز 15جم">جلوكوز 15جم</button>
            <button class="v-chip chip-btn" data-val="عصير 100مل">عصير 100مل</button>
            <button class="v-chip chip-btn" data-val="٣ تمرات">٣ تمرات</button>
          </div>
        </div>
      </div>

      <div class="field mb-15 mt-15">
        <label>ملاحظات (اختياري)</label>
        <input type="text" id="mNotes" placeholder="اكتب أي ملاحظات..." />
      </div>

      <div class="actions-row">
        <button id="saveBtn" class="btn primary btn-lg">💾 حفظ في السجل</button>
        <button id="toMealsBtn" class="btn secondary btn-lg">🍽️ إرسال لحاسبة الوجبات</button>
      </div>
    </section>

    <div class="filters-bar">
      <h3 style="margin:0; font-size:16px;">سجل قياسات اليوم</h3>
      <div class="search-box"><input type="text" id="searchBox" placeholder="بحث..." /></div>
    </div>

    <div class="timeline-container" id="timelineGrid"></div>
    
    <div id="empty" class="empty-state hidden">
      <div class="empty-icon">📭</div>
      <p>لا توجد قراءات مسجلة في هذا اليوم.</p>
    </div>

  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="loader" class="screen-loader hidden"><div class="spinner"></div></div>

  <script type="module" src="js/measurements.js?v=5"></script>
</body>
</html>
