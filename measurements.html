<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>سجل القياسات</title>
  <link rel="stylesheet" href="css/measurements.css?v=8" />
  <link rel="icon" href="favicon.png" />
</head>
<body>
  <!-- 1. شريط التنقل الموحد -->
  <header class="main-topbar no-print">
    <div class="topbar-right">
      <div class="top-avatar" id="topAvatar">أ</div>
      <div class="top-info">
        <h3 id="topChildName">جاري التحميل...</h3>
        <span id="topChildMeta" class="muted tiny">—</span>
      </div>
    </div>

    <!-- شريط تنقل ولي الأمر / الطفل -->
    <nav class="topbar-nav" id="parentNav">
      <a href="child.html" class="nav-pill" id="navHome">🏠 الرئيسية</a>
      <a href="#" class="nav-pill active" id="navMeas">📊 القياسات</a>
      <a href="meals.html" class="nav-pill" id="navMeals">🍽️ الوجبات</a>
      <a href="reports.html" class="nav-pill" id="navReports">📈 التقارير</a>
      <a href="labs.html" class="nav-pill" id="navLabs">🔬 التحاليل</a>
      <a href="visits.html" class="nav-pill" id="navVisits">🩺 الزيارات</a>
    </nav>

    <!-- شريط تنقل الطبيب السريري الموحد -->
    <nav class="topbar-nav hidden" id="doctorNav" style="display:none;">
      <a href="doctor-child.html" class="nav-pill" id="navDocStation">🩺 المحطة السريرية</a>
      <a href="reports.html" class="nav-pill" id="navDocReports">📈 التقرير (AGP)</a>
      <a href="labs.html" class="nav-pill" id="navDocLabs">🔬 التحاليل</a>
      <a href="visits.html" class="nav-pill" id="navDocVisits">🩺 الزيارات</a>
      <a href="doctor-child.html#protocolSection" class="nav-pill" id="navDocDoses">⚙️ تعديل الجرعات</a>
    </nav>

    <div class="topbar-left">
      <button id="backBtn" class="btn" style="background:#3b82f6; color:#fff; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:bold; height:36px;">🏠 رجوع للوحة الطفل</button>
      <button id="logoutBtn" class="btn-logout-outline" style="margin-inline-start:8px;">↪ خروج</button>
    </div>
  </header>

  <!-- 2. مسار التنقل (Breadcrumbs) -->
  <div class="breadcrumbs no-print">
    <a href="parent.html" id="breadRootLink">أطفالي 👨‍👩‍👧‍👦</a> <span>›</span> <a href="child.html" id="breadChildName">الطفل</a> <span>›</span> <b>سجل القياسات اليومية 📊</b>
  </div>

  <div class="container">

    <!-- شريط المعاملات -->
    <div id="therapyChips" class="chips" style="margin-bottom: 15px;"></div>

    <!-- كارت إدخال القياس الجديد -->
    <section class="table-wrap" style="padding: 20px; margin-bottom: 20px;">
      <h3 style="margin-top:0; color: var(--primary); margin-bottom: 20px;">🩸 تسجيل قراءة جديدة</h3>
      
      <div class="toolbar" style="box-shadow: none; padding: 0; margin-bottom: 15px;">
        <label class="field">
          <span>التاريخ</span>
          <input type="date" id="dayPicker" />
        </label>

        <label class="field">
          <span>الوقت</span>
          <input type="time" id="timePicker" />
        </label>

        <label class="field" style="grid-column: span 2;">
          <span>الفترة (Slot)</span>
          <select id="slotKey">
            <option value="FASTING">صائم / على الريق</option>
            <option value="PRE_BREAKFAST">قبل الفطار</option>
            <option value="POST_BREAKFAST">بعد الفطار</option>
            <option value="PRE_LUNCH">قبل الغدا</option>
            <option value="POST_LUNCH">بعد الغدا</option>
            <option value="PRE_DINNER">قبل العشا</option>
            <option value="POST_DINNER">بعد العشا</option>
            <option value="SNACK">سناك</option>
            <option value="BEDTIME">قبل النوم</option>
            <option value="EXERCISE">رياضة / مجهود</option>
            <option value="OTHER">وقت آخر</option>
          </select>
        </label>

        <!-- حقل السكر والوحدة المدمج -->
        <label class="field" style="grid-column: span 2;">
          <span>مستوى السكر والوحدة</span>
          <div class="combo-input">
            <input type="number" id="reading" step="0.1" placeholder="مثال: 120" />
            <select id="unitSel">
              <option value="mg/dL">mg/dL</option>
              <option value="mmol/L">mmol/L</option>
            </select>
          </div>
        </label>
      </div>

      <!-- لوحة التنبيهات والإجراءات -->
      <div id="actionsPanel" class="actions-panel hidden">
        <div id="smartAlert" class="alert"></div>

        <!-- حقل التصحيح -->
        <div id="corrRow" class="row-actions hidden">
          <label class="field" style="grid-column: 1 / -1;">
            <span>💉 جرعة التصحيح المأخوذة (U)</span>
            <input id="corrDoseInput" type="number" step="0.5" min="0" placeholder="مثال: 1.5">
          </label>
        </div>

        <!-- حقل علاج الهبوط -->
        <div id="hypoRow" class="row-actions hidden">
          <label class="field" style="grid-column: 1 / -1;">
            <span>🧃 عالجنا الهبوط بإيه؟</span>
            <input id="hypoTreatment" type="text" placeholder="مثال: عصير، تمر...">
          </label>
          <div class="chips">
            <button class="chip chip-btn" data-val="جلوكوز 15جم">جلوكوز 15جم</button>
            <button class="chip chip-btn" data-val="عصير 100مل">عصير 100مل</button>
            <button class="chip chip-btn" data-val="٣ تمرات">٣ تمرات</button>
          </div>
        </div>
      </div>

      <!-- الملاحظات والأزرار -->
      <label class="field" style="margin-top: 15px; margin-bottom: 15px;">
        <span>ملاحظات (اختياري)</span>
        <input type="text" id="mNotes" placeholder="اكتب أي ملاحظات..." />
      </label>

      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="saveBtn" class="btn" style="flex: 1;">💾 حفظ في السجل</button>
        <button id="toMealsBtn" class="btn btn--ghost" style="flex: 1; border-color: var(--primary); color: var(--primary);">🍽️ إرسال لحاسبة الوجبات</button>
      </div>
    </section>

    <!-- شريط أدوات السجل (بحث + تصدير) -->
    <div class="filters" style="margin-bottom: 20px;">
      <strong style="font-size: 16px;">سجل قياسات اليوم</strong>
      <div style="display: flex; gap: 10px; align-items: center;">
        <div class="search" style="flex: 1;"><input id="searchBox" type="search" placeholder="بحث..."></div>
        <button id="exportCsvBtn" class="btn btn--ghost" title="تصدير CSV">⬇️ CSV</button>
        <button id="exportXlsxBtn" class="btn btn--ghost" title="تصدير Excel">⬇️ Excel</button>
      </div>
    </div>

    <!-- كارت الخط الزمني (Timeline) بديل الجدول القديم -->
    <div class="timeline-container" id="timelineGrid"></div>
    
    <div id="empty" class="empty hidden">
      <div style="font-size: 40px; margin-bottom: 10px;">📭</div>
      <p>لا توجد قراءات مسجلة في هذا اليوم.</p>
    </div>

  </div>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="js/measurements.js?v=8"></script>
</body>
</html>
