<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعدادات الطفل</title>
  <link rel="stylesheet" href="css/child.css">
  <link rel="icon" href="favicon.png" />
</head>
<body>

  <div class="container" style="max-width: 900px; margin-top: 20px;">
    <div class="card no-print" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin:0; color:#2563eb;">⚙️ إعدادات الملف الطبي للطفل</h2>
      <button id="btnSave" class="btn primary">💾 حفظ التغييرات</button>
    </div>

    <!-- المعلومات الأساسية -->
    <section class="card">
      <h3 style="border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">المعلومات الأساسية</h3>
      <div class="grid2">
        <div class="field"><label>اسم الطفل</label><input id="f_name" type="text" /></div>
        <div class="field"><label>تاريخ الميلاد</label><input id="f_birthDate" type="date" /></div>
        <div class="field">
          <label>الجنس</label>
          <select id="f_gender"><option value="male">ذكر</option><option value="female">أنثى</option></select>
        </div>
        <div class="field"><label>الوزن (كجم)</label><input id="f_weightKg" type="number" step="0.1" /></div>
      </div>
    </section>

    <!-- الأنسولين والمعاملات -->
    <section class="card">
      <h3 style="border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">الأنسولين والمعاملات (CR / CF)</h3>
      <div class="grid2">
        <div class="field"><label>وحدة قياس السكر</label>
          <select id="f_unit"><option value="mg/dL">mg/dL</option><option value="mmol/L">mmol/L</option></select>
        </div>
        <div class="field"><label>معامل الكارب (CR) - جرام لكل وحدة</label><input id="f_carbRatio" type="number" step="0.1" /></div>
        <div class="field"><label>معامل التصحيح (CF) - هبوط لكل وحدة</label><input id="f_correctionFactor" type="number" step="0.1" /></div>
        <div class="field"><label>طويل المفعول (Basal)</label><input id="f_basalType" type="text" placeholder="مثال: Lantus" /></div>
        <div class="field"><label>سريع المفعول (Bolus)</label><input id="f_bolusType" type="text" placeholder="مثال: Novorapid" /></div>
        
        <div class="field" id="injectionWrap">
          <label>أماكن الحقن <small class="muted">(اكتب واضغط Enter)</small></label>
          <div class="chip-input-wrap">
            <div class="chip-list"></div>
            <input type="text" placeholder="مثال: الذراع الأيمن..." style="border:none; outline:none; background:transparent; margin-top:5px;" />
          </div>
        </div>
      </div>
    </section>

    <!-- الحدود والنظام الغذائي -->
    <section class="card">
      <h3 style="border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">حدود السكر والنظام الغذائي</h3>
      <div class="grid2">
        <div class="field"><label>حد الهبوط (Hypo)</label><input id="f_hypo" type="number" step="0.1" /></div>
        <div class="field"><label>حد الارتفاع (Hyper)</label><input id="f_hyper" type="number" step="0.1" /></div>
        
        <div class="field" id="allergiesWrap" style="grid-column: 1 / -1;">
          <label>حساسيات الطعام <small class="muted">(اكتب واضغط Enter)</small></label>
          <div class="chip-input-wrap">
            <div class="chip-list"></div>
            <input type="text" placeholder="مثال: جلوتين، فراولة..." style="border:none; outline:none; background:transparent; margin-top:5px;" />
          </div>
        </div>
      </div>

      <div style="margin-top:15px;">
        <label style="font-size:13px; color:#64748b; font-weight:bold;">الأنظمة الغذائية المتبعة:</label>
        <div style="display:flex; gap:15px; margin-top:8px;">
          <label><input type="checkbox" class="diet-flag" value="gluten_free"> خالي من الجلوتين</label>
          <label><input type="checkbox" class="diet-flag" value="lactose_free"> خالي من اللاكتوز</label>
          <label><input type="checkbox" class="diet-flag" value="low_carb"> قليل الكارب</label>
        </div>
      </div>
    </section>

  </div>

  <div id="loader" class="loader hidden"><div class="spinner"></div></div>

  <script type="module" src="js/child-edit.js"></script>
  <script type="module" src="js/header.js"></script>
</body>
</html>
