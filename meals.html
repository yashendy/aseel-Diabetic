<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة الوجبات ومطبخ أسيل</title>
  <link rel="stylesheet" href="css/meals.css?v=2026.03.02">
  <link rel="icon" href="favicon.ico">
  <style>
    .final-dose-input { font-size: 32px; font-weight: 900; color: var(--danger); width: 100%; text-align: center; background: #fff; border: 2px solid #fca5a5; border-radius: 12px; outline: none; padding: 10px; }
    .result-box.safe .final-dose-input { color: var(--ok); border-color: #86efac; }
    .hypo-rescue-box { background: #fff1f2; border: 1px solid #fda4af; border-radius: 12px; padding: 15px; margin-top: 15px; display: none; }
    .notes-area { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: inherit; margin-top: 10px; resize: vertical; }
  </style>
</head>
<body>

  <header class="main-topbar no-print">
    <div class="topbar-right">
      <div class="top-avatar" id="topAvatar">أ</div>
      <div class="top-info">
        <h3 id="topChildName">جاري التحميل...</h3>
        <span id="topChildMeta" class="muted tiny">—</span>
      </div>
    </div>
    <nav class="topbar-nav">
      <a href="child.html" class="nav-pill" id="navHome">🏠 الرئيسية</a>
      <a href="measurements.html" class="nav-pill" id="navMeas">📊 القياسات</a>
      <a href="#" class="nav-pill active">🍽️ الوجبات</a>
      <a href="reports.html" class="nav-pill" id="navReports">📈 التقارير</a>
    </nav>
    <div class="topbar-left"><button id="logoutBtn" class="btn-logout-outline">↪ خروج</button></div>
  </header>

  <div class="breadcrumbs no-print">
    <a href="parent.html">أطفالي</a> <span>›</span> <a href="child.html" id="breadChildName">الطفل</a> <span>›</span> <b>حاسبة ومطبخ أسيل 🍽️</b>
  </div>

  <div class="container">
    <div class="diet-tracker">
      <div class="diet-header"><div class="diet-title">مؤشرات الاستهلاك اليومي 🥗</div></div>
      <div class="tracker-row">
        <div class="tracker-info"><span>الكارب (g)</span><input type="number" id="dailyCarbTarget" class="tracker-input" placeholder="الحد"></div>
        <div class="progress-bg"><div class="progress-fill carb-fill" id="carbProgressBar"></div></div>
        <div class="diet-status" id="carbProgressText">إجمالي المستهلك اليوم: 0 جرام</div>
      </div>
      <div class="tracker-row mt-10">
        <div class="tracker-info"><span>السعرات (kcal)</span><input type="number" id="dailyCalorieTarget" class="tracker-input" placeholder="الحد"></div>
        <div class="progress-bg"><div class="progress-fill cal-fill" id="calProgressBar"></div></div>
        <div class="diet-status" id="calProgressText">إجمالي المستهلك اليوم: 0 kcal</div>
      </div>
    </div>

    <section class="card">
      <div class="card-header"><h2>🧮 حاسبة الأنسولين والبروتوكول الطبي</h2></div>
      
      <div class="factors-bar">
        <span class="f-chip">🎯 الهدف: <span id="lblTarget">—</span></span>
        <span class="f-chip">🍔 CR: <span id="lblCR">—</span></span>
        <span class="f-chip">💉 CF: <span id="lblCF">—</span></span>
      </div>

      <div class="calc-row">
        <div class="field"><label>التاريخ</label><input type="date" id="dateInput" class="input"></div>
        <div class="field"><label>الوقت</label><input type="time" id="timeInput" class="input"></div>
      </div>

      <div class="calc-row">
        <div class="field">
          <label>الوجبة</label>
          <select id="slotSelect">
            <option value="PRE_BREAKFAST">فطار</option>
            <option value="PRE_LUNCH">غدا</option>
            <option value="PRE_DINNER">عشا</option>
            <option value="SNACK">سناك</option>
          </select>
        </div>
        <div class="field">
          <label>نوع القياس</label>
          <select id="measureSource">
            <option value="bgm">وخز الإصبع (BGM)</option>
            <option value="cgm" selected>حساس سكر (CGM)</option>
          </select>
        </div>
      </div>

      <div class="calc-row">
        <div class="field">
          <label>قراءة السكر قبل الوجبة</label>
          <div class="input-group">
            <button class="btn-fetch" id="btnFetchPre" title="سحب البيانات من السجل">🔄 جلب</button>
            <input type="number" step="0.1" id="preBg" class="input" placeholder="0">
            <select id="preBgUnit" style="width:80px;"><option value="mg/dL">mg/dL</option><option value="mmol/L">mmol/L</option></select>
          </div>
        </div>
        <div class="field" id="trendContainer">
          <label>سهم الحساس (للضبط الذكي)</label>
          <select id="trendArrow" class="input">
            <option value="0">➔ ثابت</option>
            <option value="15">↑ بطيء (+15)</option>
            <option value="30">⇈ سريع (+30)</option>
            <option value="-15">↓ بطيء (-15)</option>
            <option value="-30">⇊ سريع (-30)</option>
          </select>
        </div>
      </div>

      <div class="calc-row">
        <div class="field">
          <label>جرعة الكارب (Carb Dose) 🍔</label>
          <input type="number" step="0.1" id="doseCarbs" class="input" placeholder="0.0">
        </div>
        <div class="field">
          <label>جرعة التصحيح (Correction) 💉</label>
          <input type="number" step="0.1" id="doseCorrection" class="input" placeholder="0.0">
        </div>
      </div>

      <div class="calc-row">
        <div class="field">
          <label>أنسولين نشط للخصم (IOB) ⏳</label>
          <input type="number" step="0.1" id="iobValue" class="input" placeholder="0.0">
        </div>
        <div class="field">
          <label><b>إجمالي الأنسولين المطلوب 💉</b></label>
          <input type="number" step="0.5" id="doseFinalInput" class="final-dose-input">
        </div>
      </div>
