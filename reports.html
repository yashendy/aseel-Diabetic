<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>التقرير الذكي وسجل المتابعة</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/reports.css?v=3"/>
</head>
<body>
  <!-- شريط التنقل الموحد -->
  <header class="topbar no-print" style="background: #1e3a8a; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 24px;">📊</span>
      <h2 style="margin: 0; font-size: 18px;">اللوجبوك والتقارير الذكية (Logbook)</h2>
    </div>
    <div>
      <button onclick="window.close()" class="btn" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">إغلاق التقرير ✕</button>
    </div>
  </header>

  <div id="appLoader" class="loader"><span class="spinner"></span><span>يجري التحميل...</span></div>

  <div class="container">
    <section class="filters">
      <div class="row">
        <label class="field"><span>من</span><input type="date" id="fromDate"></label>
        <label class="field"><span>إلى</span><input type="date" id="toDate"></label>
        <label class="field">
          <span>الوحدة</span>
          <select id="unitSel"><option value="mmol/L">mmol/L</option><option value="mg/dL">mg/dL</option></select>
        </label>
        <button id="applyBtn" class="btn">تحديث البيانات</button>
        <div class="grow"></div>
        <button id="openPrint" class="btn btn--ghost">🖨️ طباعة التقرير</button>
        <button id="openPrintBlank" class="btn btn--ghost">📝 طباعة سجل فارغ</button>
      </div>
      <div class="chips" id="thresholdChips" style="margin-top: 10px;"></div>
    </section>

    <!-- ... باقي كودك الأصلي للـ Reports كما هو ... -->
    <section class="summary">
      <div class="cards">
        <div class="card"><span class="k">داخل النطاق (TIR)</span><b id="statTIR">—</b></div>
        <div class="card low"><span class="k">انخفاض (TBR)</span><b id="statLow">—</b></div>
        <div class="card high"><span class="k">ارتفاع (TAR)</span><b id="statHigh">—</b></div>
        <div class="card"><span class="k">المتوسط</span><b id="statAvg">—</b></div>
      </div>
      <div class="pie-box" style="width: 150px; height: 150px;"><canvas id="pieTIR"></canvas></div>
    </section>

    <section class="grid-wrap">
      <div class="grid-head">
        <div class="r">التاريخ</div>
        <div class="col-total">إجمالي اليوم</div>
        <div>صائم/استيقاظ</div>
        <div>ق.الفطار</div><div>ب.الفطار</div>
        <div>ق.الغداء</div><div>ب.الغداء</div>
        <div>ق.العشاء</div><div>ب.العشاء</div>
        <div>سناك</div><div>قبل النوم</div><div>أثناء النوم</div>
      </div>
      <div id="reportGrid" class="grid-body"></div>
      <div id="emptyGrid" class="empty hidden">لا توجد بيانات مسجلة في هذه الفترة</div>
    </section>

    <section class="ai" style="margin-top: 20px;">
      <h3 style="color: #1e3a8a;">التحليلات الذكية والأنماط (AI) 🧠</h3>
      <div id="aiTable" class="ai-table"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="js/reports.js?v=3"></script>
</body>
</html>
