<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الزيارات والمتابعات الطبية</title>
  <link rel="stylesheet" href="css/visits.css?v=6">
  <link rel="icon" href="favicon.ico">
</head>
<body>
  <!-- شريط التنقل الموحد -->
  <header class="topbar no-print" style="background: #1e3a8a; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 24px;">🩺</span>
      <h2 style="margin: 0; font-size: 18px;">الزيارات والمتابعات الطبية (Visits)</h2>
    </div>
    <div>
      <button onclick="window.close()" class="btn" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;">إغلاق النافذة ✕</button>
    </div>
  </header>

  <div id="appLoader" class="loader"><span class="spinner"></span><span>جاري جلب البيانات...</span></div>

  <div class="container">
    
    <section class="stats-bar no-print">
      <div class="stat-box"><span class="icon">📅</span> أقرب متابعة: <strong id="nextFollowUp" class="text-primary">—</strong></div>
      <div class="stat-box"><span class="icon">⚠️</span> توصيات بانتظار التطبيق: <strong id="pendingCount" class="text-danger">0</strong></div>
      <div class="stat-box"><span class="icon">🩺</span> آخر زيارة: <strong id="lastVisit">—</strong></div>
    </section>

    <section class="actions-card no-print">
      <div class="filters">
        <select id="filterType" class="input">
          <option value="">كل أنواع الزيارات</option>
          <option>متابعة دورية</option>
          <option>طارئة</option>
          <option>فحص معملي</option>
          <option>استشارة أونلاين</option>
        </select>

        <select id="filterApplied" class="input">
          <option value="">حالة التطبيق (الكل)</option>
          <option value="false">بانتظار التطبيق</option>
          <option value="true">تم التطبيق</option>
        </select>

        <div class="date-range">
          <span>من</span><input type="date" id="fromDate" class="input">
          <span>إلى</span><input type="date" id="toDate" class="input">
        </div>

        <input type="search" id="searchBox" class="input search-input" placeholder="ابحث باسم الطبيب أو السبب..." />

        <div class="btn-group">
          <button id="newVisitBtn" class="btn primary">➕ إضافة زيارة</button>
          <button id="exportCSV" class="btn ghost">⬇️ CSV</button>
          <button id="printList" class="btn ghost">🖨️ طباعة</button>
        </div>
      </div>
    </section>

    <div class="main-layout">
      <section class="visits-section">
        <div id="visitsList" class="visits-grid"></div>
      </section>

      <aside class="ai-sidebar no-print">
        <div class="ai-card">
          <div class="ai-header">
            <h3>💡 أجندة الطبيب (AI)</h3>
            <span class="tiny-text">تحليل آخر 7 أيام</span>
          </div>
          <ul id="aiList" class="ai-list">
            <li>جاري تحليل القياسات...</li>
          </ul>
          <button id="copyAgenda" class="btn secondary full-width">📋 نسخ الأجندة</button>
        </div>
      </aside>
    </div>

  </div>

  <!-- نافذة إضافة زيارة -->
  <div id="visitModal" class="modal hidden">
    <div class="modal-body">
      <div class="modal-header">
        <h3 id="modalTitle">إضافة زيارة طبية</h3>
        <button id="closeModal" class="close-btn">✕</button>
      </div>

      <form id="visitForm" class="modal-form" novalidate>
        <div class="grid2">
          <div class="field"><label>تاريخ الزيارة</label><input type="date" id="date" required></div>
          <div class="field"><label>نوع الزيارة</label>
            <select id="type" required>
              <option value="">اختر النوع</option>
              <option>متابعة دورية</option><option>طارئة</option><option>فحص معملي</option><option>استشارة أونلاين</option>
            </select>
          </div>
          <div class="field"><label>الطبيب / المركز</label><input type="text" id="doctorName" placeholder="مثال: د/ محمد علي" required></div>
          <div class="field"><label>وقت الزيارة</label><input type="time" id="time"></div>
        </div>
        
        <div class="field"><label>سبب الزيارة</label><input type="text" id="reason" placeholder="متابعة جرعات / هبوط متكرر..."></div>
        
        <div class="field"><label>خلاصة وتشخيص الطبيب</label><textarea id="summary" rows="2" placeholder="ماذا قال الطبيب؟"></textarea></div>
        
        <div class="field"><label>التوصيات والتعليمات</label><textarea id="recommendations" rows="3" placeholder="اكتب التعليمات لتتذكرها..."></textarea></div>
        
        <div class="grid2 bg-light pad-10">
          <div class="field"><label>تعديل القاعدي (طويل المفعول)</label><input type="text" id="longActingChange" placeholder="مثال: +1 وحدة ليلاً"></div>
          <div class="field"><label>تعديل جرعات الوجبات</label><input type="text" id="mealDosesChange" placeholder="مثال: تقليل معامل الفطار"></div>
        </div>

        <div class="field"><label>فحوصات مطلوبة (افصلها بفواصل)</label><input type="text" id="labsRequested" placeholder="HbA1c, Lipid Profile, TSH"></div>
        
        <div class="grid2">
          <div class="field"><label>موعد المتابعة القادمة</label><input type="date" id="followUpDate"></div>
          <div class="field"><label>حالة تطبيق التعليمات</label>
            <select id="applied"><option value="false">⏳ بانتظار التطبيق</option><option value="true">✅ تم التطبيق</option></select>
          </div>
        </div>

        <div class="field">
          <label>إرفاق ملفات (روشتة / تحاليل)</label>
          <input type="file" id="attachments" multiple accept=".png,.jpg,.jpeg,.pdf">
          <div id="selectedFiles" class="files-wrap"></div>
        </div>
        <div class="field hidden" id="existingWrap"><label>المرفقات الحالية</label><div id="existingFiles" class="files-wrap"></div></div>

        <div class="form-actions" style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" id="cancelVisitBtn" class="btn ghost">إلغاء</button>
          <button type="submit" id="saveVisitBtn" class="btn primary">💾 حفظ الزيارة</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/visits.js?v=6"></script>
  <script type="module" src="js/header.js"></script>
</body>
</html>
