<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>السجل الطبي والتحاليل الشاملة</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/labs.css?v=3">

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- شريط التنقل الموحد -->
  <header class="topbar no-print" style="background: #2563eb; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 24px;">🧪</span>
      <h2 style="margin: 0; font-size: 18px;">سجل التحاليل الطبية (Labs)</h2>
    </div>
    <div>
      <button onclick="window.close()" class="btn" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">إغلاق النافذة ✕</button>
    </div>
  </header>

  <div id="appLoader" class="loader"><span class="spinner"></span><span>جاري معالجة البيانات الطبية...</span></div>

  <div class="container">
    <div class="card no-print row space top-bar">
      <div class="row">
        <button id="saveBtn" class="btn primary">💾 حفظ السجل</button>
        <button id="savePdfBtn" class="btn ghost">💾 حفظ + ⬇️ PDF</button>
        <button id="printBtn" class="btn secondary">🖨️ طباعة</button>
      </div>
      <div id="dueBadge" class="pill bold"></div>
    </div>

    <!-- ... باقي كود صفحة التحاليل القديم الخاص بكِ كما هو ... -->
    <div class="grid-main">
      <div class="card">
        <h3>📅 بيانات التقرير</h3>
        <label class="tiny">تاريخ التحليل</label>
        <input id="labDate" type="date">
        <label class="tiny" style="margin-top:10px">نوع الفحص</label>
        <select id="labType">
          <option value="hba1c_only">دوري (HbA1c فقط)</option>
          <option value="full">شامل (سنوي / فحص كامل)</option>
        </select>
      </div>
      <div class="card">
        <h3>📈 تطور السكر التراكمي (HbA1c)</h3>
        <div style="height:140px"><canvas id="hba1cChart"></canvas></div>
      </div>
    </div>

    <div class="card section-card">
      <div class="section-head"><h3 style="margin:0;">🩸 السكر التراكمي</h3> <span class="ref-range" style="font-size:12px; color:#64748b;">الهدف: &lt; 7.0%</span></div>
      <table>
        <tr><th>النتيجة (%)</th><th>الحالة</th><th>ملاحظات الطبيب</th></tr>
        <tr>
          <td><input id="hba1cVal" type="number" step="0.1" class="main-input"></td>
          <td id="hba1cStatus" style="text-align: center; font-weight: bold;">—</td>
          <td><input id="hba1cNote" placeholder="مثال: استمر على الخطة"></td>
        </tr>
      </table>
    </div>

    <!-- ... نفس باقي الهيكل لـ CBC والفيتامينات ... -->
    <div class="card no-print">
      <h3>📜 سجل التحاليل السابقة</h3>
      <div class="table-scroll">
        <table id="historyTable">
          <thead><tr><th>التاريخ</th><th>النوع</th><th>التراكمي</th><th>إجراءات</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="js/labs.js?v=4"></script>
</body>
</html>
